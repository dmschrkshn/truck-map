<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автовозы в пути</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif; }
    #map { width:100%; height:100%; }

    #panel {
      position:absolute; top:0; left:0; bottom:0; width:300px; z-index:1000;
      background:#fff; box-shadow:2px 0 14px rgba(0,0,0,.12);
      display:flex; flex-direction:column; transition:transform .25s ease;
    }
    #panel.hidden { transform:translateX(-300px); }
    #panel-head { padding:15px 16px 11px; border-bottom:1px solid #eceff1; }
    #panel-head h1 { margin:0 0 3px; font-size:16px; font-weight:600; color:#1c2833; }
    #panel-head .sub { font-size:12px; color:#90a4ae; margin-bottom:11px; }

    #search {
      width:100%; padding:8px 11px; font-size:16px;
      border:1px solid #cfd8dc; border-radius:7px; outline:none;
      transition:border-color .15s;
    }
    #search:focus { border-color:#2c7fb8; }

    #list { flex:1; overflow-y:auto; padding:5px 0; -webkit-overflow-scrolling:touch; }
    #empty { padding:22px 16px; font-size:13px; color:#b0bec5; text-align:center; }

    .item {
      display:flex; align-items:flex-start; gap:10px;
      padding:11px 16px; cursor:pointer; border-left:3px solid transparent;
      transition:background .12s;
    }
    .item:hover { background:#f5f7f9; }
    .item.active { background:#eef4f8; border-left-color:#2c7fb8; }
    .item .ico { width:32px; flex:none; padding-top:2px; }
    .item .txt { min-width:0; flex:1; }
    .item .name { font-size:14px; font-weight:600; color:#263238; }
    .item .meta { font-size:12px; color:#78909c; margin-top:2px; line-height:1.5; }
    .item .note {
      font-size:11px; color:#8d6e63; margin-top:4px;
      background:#fff8e1; padding:3px 7px; border-radius:4px;
      display:inline-block; max-width:100%; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap;
    }
    .item.lost .meta { color:#c0392b; }

    /* Кнопка открытия панели — с текстом «Поиск» */
    #toggle {
      position:absolute; top:14px; left:314px; z-index:1001;
      height:38px; padding:0 14px; border:0; border-radius:9px; background:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.18); cursor:pointer;
      font-size:14px; font-weight:600; line-height:1; color:#37474f;
      display:flex; align-items:center; gap:7px; transition:left .25s ease;
    }
    #toggle .ic { font-size:16px; }
    #toggle .label { display:none; }          /* по умолчанию (десктоп) — только иконка */
    #panel.hidden ~ #toggle { left:14px; }
    #panel.hidden ~ #toggle .label { display:inline; }  /* когда свёрнута — показываем «Поиск» */

    #legend {
      position:absolute; bottom:20px; right:14px; z-index:1000;
      background:#fff; padding:11px 15px; border-radius:9px;
      box-shadow:0 2px 12px rgba(0,0,0,.16); font-size:13px; line-height:1.75;
    }
    #legend b { display:block; margin-bottom:7px; font-size:10px;
      letter-spacing:.06em; color:#90a4ae; font-weight:600; }
    #legend div { display:flex; align-items:center; gap:9px; color:#37474f; }
    #legend .sw { width:13px; height:13px; border-radius:3px; flex:none; }

    #stamp {
      position:absolute; top:14px; right:14px; z-index:1000;
      background:rgba(255,255,255,.95); padding:7px 13px; border-radius:7px;
      font-size:12px; color:#546e7a; box-shadow:0 2px 10px rgba(0,0,0,.13);
    }

    /* Затемнение под панелью на мобильном */
    #backdrop {
      position:absolute; inset:0; z-index:999; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:opacity .25s;
    }

    @media (max-width: 720px) {
      #panel {
        width:82%; max-width:330px;
        box-shadow:2px 0 22px rgba(0,0,0,.28);
      }
      #panel.hidden { transform:translateX(-105%); }
      #toggle {
        left:14px; top:14px;                 /* всегда слева, панель по умолчанию скрыта */
        height:42px; padding:0 16px; font-size:15px;
      }
      #toggle .label { display:inline; }      /* на мобильном подпись видна всегда */
      #panel:not(.hidden) ~ #backdrop { opacity:1; pointer-events:auto; }
      #legend { bottom:12px; right:10px; font-size:11px; padding:8px 11px; line-height:1.6; }
      #legend .sw { width:11px; height:11px; }
      #stamp { display:none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="panel-head">
      <h1>Автовозы в пути</h1>
      <div class="sub" id="count">загрузка…</div>
      <input id="search" type="text" placeholder="Поиск по номеру…" autocomplete="off">
    </div>
    <div id="list"></div>
  </div>
  <div id="backdrop"></div>
  <button id="toggle" title="Открыть список и поиск">
    <span class="ic">🔍</span><span class="label">Поиск</span>
  </button>

  <div id="stamp">загрузка…</div>

  <div id="legend">
    <b>СОСТОЯНИЕ</b>
    <div><span class="sw" style="background:#2e9e5b"></span> данные до 2 дней</div>
    <div><span class="sw" style="background:#e08b1e"></span> 3–4 дня</div>
    <div><span class="sw" style="background:#222"></span> 5 дней и более</div>
    <div><span class="sw" style="background:#1565c0"></span> малое перемещение</div>
  </div>

  <script src="https://api-maps.yandex.ru/2.1/?apikey=aeb19683-8505-416a-a1c4-090e24030cd0&lang=ru_RU"></script>

  <script>
    var API = 'https://script.google.com/macros/s/AKfycbwdjusGg4nQmK9jieXklITebNhkSC4Pu8fbqA2NsGxgtjhRk_id0W7MbYForU901Xki/exec';

    var map, cluster, records = [], marksByTruck = {};
    var isMobile = window.matchMedia('(max-width: 720px)').matches;

    // Автовоз сбоку, viewBox 60×31: тягач кабиной влево (едут на запад, к Москве),
    // верхний ярус тянется над кабиной, четыре машины сверху и две снизу.
    // body — рама и тягач, car — машины на платформе, glass — стёкла.
    function carrierShape(body, car, glass, carOpacity) {
      var op = carOpacity === undefined ? 1 : carOpacity;
      function auto(x, y) {
        return '<g transform="translate(' + x + ',' + y + ')">' +
          '<path fill="' + car + '" opacity="' + op + '" ' +
            'd="M0.4 5.2V3.6C0.4 3 .8 2.6 1.4 2.5L3.2 2.2 4.9.5C5.2.2 5.6 0 6 0h3.3c.5 0 .9.2 1.2.6L11.8 2.2 12.8 2.4c.5.1.8.5.8 1v1.8z"/>' +
          '<path fill="' + glass + '" opacity=".85" d="M4.3 2.2 5.6.9h1.6v1.3zM8.1.9h1.1l1.2 1.3H8.1z"/>' +
        '</g>';
      }
      function wheel(cx) {
        return '<circle cx="' + cx + '" cy="27" r="3.1" fill="#1b1f23"/>' +
               '<circle cx="' + cx + '" cy="27" r="1.2" fill="#cfd8dc"/>';
      }
      return (
        // ярусы и стойки
        '<path fill="' + body + '" d="M2.6 11.6h55.9v1.7H2.6z"/>' +
        '<path fill="' + body + '" d="M17.4 24h41.1v2.2H17.4z"/>' +
        '<path fill="' + body + '" d="M17.4 11.6h1.7V24h-1.7zM37.6 11.6h1.4V24h-1.4zM56.8 11.6h1.7V24h-1.7z"/>' +
        '<path fill="' + body + '" opacity=".5" d="M19.1 22 37.6 14.5v1.3L19.1 23.3zM39 22l17.8-7.5v1.3L39 23.3z"/>' +
        // машины
        auto(3.2, 6.3) + auto(17.6, 6.3) + auto(31.2, 6.3) + auto(44.8, 6.3) +
        auto(21.4, 18.7) + auto(40.8, 18.7) +
        // тягач: кабина, лобовое стекло, дверь, фара, бампер
        '<path fill="' + body + '" d="M1.2 26.2v-6.6c0-.7.2-1.4.7-1.9l3.1-3.6c.4-.4.9-.7 1.5-.7h8.9c.9 0 1.6.7 1.6 1.6v11.2z"/>' +
        '<path fill="' + glass + '" d="M3.2 18.9 5.6 16.1c.2-.2.5-.4.8-.4h6.2c.4 0 .7.3.7.7v2.5z"/>' +
        '<path fill="' + glass + '" opacity=".45" d="M10 20.2h.9v4.4H10z"/>' +
        '<path fill="#ffd54f" d="M1.2 21.4h1.9v1.6H1.2z"/>' +
        '<path fill="#1b1f23" opacity=".55" d="M.6 24.6h3.6v1.6H.6z"/>' +
        // колёса: тягач + двухосная тележка прицепа
        wheel(6.2) + wheel(13.2) + wheel(47.4) + wheel(53.6)
      );
    }

    // Иконка для списка: цветной силуэт на прозрачном фоне.
    function truckSVG(color, w, h) {
      w = w || 60; h = h || 31;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 31" width="' + w + '" height="' + h + '">' +
        carrierShape(color, color, '#ffffff', 0.6) + '</svg>';
    }

    function escapeXml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Ширина номера в пикселях: иероглифы шире латиницы и цифр.
    function textWidth(s, px) {
      var w = 0;
      for (var i = 0; i < s.length; i++) w += /[　-鿿＀-￯]/.test(s[i]) ? px * 1.02 : px * 0.62;
      return w;
    }

    // Метка на карте: белая «таблетка» [цветной блок с автовозом | номер] с хвостиком.
    // Кончик хвостика — ровно точка локации. Возвращает картинку, размер и смещение.
    function markerSVG(color, label, hasNote, stuck) {
      var text = escapeXml(label);
      var chipW = 46, H = 28, pad = 8, tail = 7;
      var tw = Math.ceil(textWidth(label, 12));
      var W = chipW + pad + tw + pad;
      var x0 = 1, y0 = 5;                              // запас сверху и справа под бейдж
      var svgW = W + 7, svgH = y0 + H + tail + 3;
      var cx = x0 + W / 2;
      var r = 6;

      var badge = '';
      var bx = x0 + W - 1, by = y0 + 1;
      if (stuck) {
        badge = '<circle cx="' + bx + '" cy="' + by + '" r="6" fill="#1565c0" stroke="#fff" stroke-width="1.6"/>' +
                '<text x="' + bx + '" y="' + (by + 3.3) + '" font-size="9" font-weight="800" fill="#fff" ' +
                'text-anchor="middle" font-family="Arial">!</text>';
      } else if (hasNote) {
        badge = '<circle cx="' + bx + '" cy="' + by + '" r="4.6" fill="#e53935" stroke="#fff" stroke-width="1.6"/>';
      }

      var outline =
        'M' + (x0 + r) + ' ' + y0 + 'H' + (x0 + W - r) +
        'Q' + (x0 + W) + ' ' + y0 + ' ' + (x0 + W) + ' ' + (y0 + r) +
        'V' + (y0 + H - r) +
        'Q' + (x0 + W) + ' ' + (y0 + H) + ' ' + (x0 + W - r) + ' ' + (y0 + H) +
        'H' + (cx + 6) + 'L' + cx + ' ' + (y0 + H + tail) + 'L' + (cx - 6) + ' ' + (y0 + H) +
        'H' + (x0 + r) +
        'Q' + x0 + ' ' + (y0 + H) + ' ' + x0 + ' ' + (y0 + H - r) +
        'V' + (y0 + r) +
        'Q' + x0 + ' ' + y0 + ' ' + (x0 + r) + ' ' + y0 + 'Z';

      var chip =
        'M' + (x0 + r) + ' ' + y0 + 'H' + (x0 + chipW) + 'V' + (y0 + H) + 'H' + (x0 + r) +
        'Q' + x0 + ' ' + (y0 + H) + ' ' + x0 + ' ' + (y0 + H - r) +
        'V' + (y0 + r) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + r) + ' ' + y0 + 'Z';

      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '">' +
          '<defs><filter id="s" x="-20%" y="-30%" width="140%" height="170%">' +
            '<feDropShadow dx="0" dy="1.2" stdDeviation="1.3" flood-color="#000" flood-opacity=".28"/></filter></defs>' +
          '<path filter="url(#s)" fill="#fff" stroke="' + color + '" stroke-width="1.4" d="' + outline + '"/>' +
          '<path fill="' + color + '" d="' + chip + '"/>' +
          '<g transform="translate(' + (x0 + 3) + ',' + (y0 + 3.6) + ') scale(0.68)">' +
            carrierShape('#ffffff', '#ffffff', color, 0.72) +
          '</g>' +
          '<text x="' + (x0 + chipW + pad + tw / 2) + '" y="' + (y0 + 18.3) + '" text-anchor="middle" ' +
            'font-family="-apple-system,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif" ' +
            'font-size="12" font-weight="700" fill="#1c2833">' + text + '</text>' +
          badge +
        '</svg>';

      return {
        href: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        size: [svgW, svgH],
        offset: [-cx, -(y0 + H + tail)]
      };
    }

    function ageColor(d) {
      if (d <= 2) return '#2e9e5b';
      if (d <= 4) return '#e08b1e';
      return '#222222';
    }

    function markColor(p) {
      if (p.stuck) return '#1565c0';
      return ageColor(p.days);
    }

    function agoText(d) {
      if (d === 0) return 'сегодня';
      if (d === 1) return 'вчера';
      var last = d % 10, tens = d % 100;
      var w = (last === 1 && tens !== 11) ? 'день'
            : (last >= 2 && last <= 4 && (tens < 12 || tens > 14)) ? 'дня' : 'дней';
      return d + ' ' + w + ' назад';
    }

    function daysWord(d) {
      var last = d % 10, tens = d % 100;
      if (last === 1 && tens !== 11) return 'день';
      if (last >= 2 && last <= 4 && (tens < 12 || tens > 14)) return 'дня';
      return 'дней';
    }

    function etaText(eta) {
      if (eta === 0) return 'прибыл';
      return '~' + eta + ' ' + daysWord(eta);
    }

    function kmText(km) {
      return Number(km).toLocaleString('ru-RU') + ' км';
    }

    // ---- Управление панелью ----
    function openPanel() {
      document.getElementById('panel').classList.remove('hidden');
      setTimeout(function () { if (map) map.container.fitToViewport(); }, 260);
    }
    function closePanel() {
      document.getElementById('panel').classList.add('hidden');
      setTimeout(function () { if (map) map.container.fitToViewport(); }, 260);
    }
    function togglePanel() {
      if (document.getElementById('panel').classList.contains('hidden')) openPanel();
      else closePanel();
    }

    ymaps.ready(function () {
      map = new ymaps.Map('map', {
        center: [58, 60], zoom: 4,
        controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
      }, { suppressMapOpenBlock: true });

      cluster = new ymaps.Clusterer({
        groupByCoordinates: false,
        gridSize: 80,
        clusterDisableClickZoom: false,
        clusterOpenBalloonOnClick: true,
        clusterBalloonContentLayout: 'cluster#balloonCarousel',
        clusterBalloonPagerSize: 5,
        clusterIconLayout: 'default#pieChart',
        clusterIconPieChartRadius: 22,
        clusterIconPieChartCoreRadius: 14,
        clusterIconPieChartStrokeWidth: 2
      });
      map.geoObjects.add(cluster);

      // На мобильном панель стартует свёрнутой
      if (isMobile) document.getElementById('panel').classList.add('hidden');

      refresh();
      setInterval(refresh, 300000);
    });

    document.getElementById('toggle').onclick = togglePanel;
    document.getElementById('backdrop').onclick = closePanel;

    document.getElementById('search').oninput = function () {
      renderList(this.value.trim().toLowerCase());
    };

    function renderList(filter) {
      var list = document.getElementById('list');
      list.innerHTML = '';

      var shown = records.filter(function (p) {
        return !filter || p.truck.toLowerCase().indexOf(filter) !== -1;
      });

      if (!shown.length) {
        list.innerHTML = '<div id="empty">Ничего не найдено</div>';
        return;
      }

      shown.forEach(function (p) {
        var item = document.createElement('div');
        item.className = 'item' + (p.days >= 5 ? ' lost' : '');

        var noteHtml = p.note
          ? '<div class="note" title="' + escapeXml(p.note) + '">' + escapeXml(p.note) + '</div>'
          : '';

        var metaLine = kmText(p.km) + ' до Москвы · ' + etaText(p.eta) +
          (p.leg !== null ? ' · прошёл ' + kmText(p.leg) : '') +
          ' · ' + agoText(p.days) +
          (p.stuck ? ' · <b style="color:#1565c0">стоит</b>' : '');

        item.innerHTML =
          '<span class="ico">' + truckSVG(markColor(p), 31, 16) + '</span>' +
          '<span class="txt">' +
            '<div class="name">' + p.truck + (p.prev ? ' <span style="font-weight:400;color:#b0bec5;font-size:11px">← ' + p.prev + '</span>' : '') + '</div>' +
            '<div class="meta">' + metaLine + '</div>' +
            noteHtml +
          '</span>';

        item.onclick = function () {
          var all = document.querySelectorAll('.item');
          for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
          item.classList.add('active');

          // На мобильном закрываем панель, чтобы видеть карту
          if (isMobile) closePanel();

          map.setCenter([p.lat, p.lon], 9, { duration: 500 });
          setTimeout(function () {
            var pm = marksByTruck[p.truck];
            if (pm) pm.balloon.open();
          }, isMobile ? 620 : 560);
        };

        list.appendChild(item);
      });
    }

    function balloonBody(p) {
      var lost = p.days >= 5;

      var legRow = p.leg !== null
        ? '<tr><td style="color:#78909c;padding-right:12px">Прошёл с прошлого раза</td>' +
          '<td style="text-align:right;font-weight:600">' + kmText(p.leg) + '</td></tr>'
        : '';

      var noteBlock = p.note
        ? '<div style="margin-top:10px;padding:8px 10px;background:#fff8e1;' +
          'border-left:3px solid #e08b1e;border-radius:0 4px 4px 0;font-size:12px;color:#5d4037">' +
          '<b>Комментарий</b><br>' + escapeXml(p.note) + '</div>'
        : '';

      var stuckBlock = p.stuck
        ? '<div style="margin-top:9px;padding:8px 10px;background:#e3f2fd;' +
          'border-left:3px solid #1565c0;border-radius:0 4px 4px 0;font-size:12px;color:#0d47a1">' +
          '<b>Малое перемещение</b><br>Автовоз почти не сдвинулся с прошлой отметки — возможна стоянка или задержка</div>'
        : '';

      var lostBlock = lost
        ? '<div style="color:#c0392b;margin-top:9px;font-weight:600;font-size:12px">Связь потеряна более 5 дней</div>'
        : '';

      return '<div style="font-size:13px;line-height:1.85;min-width:210px">' +
          '<table style="width:100%;border-collapse:collapse">' +
            '<tr><td style="color:#78909c;padding-right:12px">До Москвы</td>' +
                '<td style="text-align:right;font-weight:600">' + kmText(p.km) + '</td></tr>' +
            '<tr><td style="color:#78909c">Прибытие</td>' +
                '<td style="text-align:right;font-weight:600">' + etaText(p.eta) + '</td></tr>' +
            legRow +
            '<tr><td style="color:#78909c">Обновлено</td>' +
                '<td style="text-align:right">' + p.ts.toLocaleDateString('ru-RU') + '</td></tr>' +
            '<tr><td style="color:#78909c">Давность</td>' +
                '<td style="text-align:right;color:' + (lost ? '#c0392b' : '#37474f') + '">' + agoText(p.days) + '</td></tr>' +
          '</table>' +
          noteBlock + stuckBlock + lostBlock +
        '</div>';
    }

    function refresh() {
      fetch(API + '?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          records = data.map(function (p) {
            var ts = new Date(p.ts);
            var days = Math.floor((Date.now() - ts) / 864e5);
            return {
              truck: p.truck, lat: p.lat, lon: p.lon, ts: ts, days: days,
              km: p.km || 0, eta: (p.eta === 0 ? 0 : (p.eta || 0)),
              note: p.note || '', color: ageColor(days),
              leg: (p.leg === null || p.leg === undefined) ? null : p.leg,
              stuck: !!p.stuck,
              prev: p.prev || ''
            };
          });

          records.sort(function (a, b) {
            if (a.stuck !== b.stuck) return a.stuck ? -1 : 1;
            return a.km - b.km;
          });

          cluster.removeAll();
          marksByTruck = {};

          var placemarks = records.map(function (p) {
            var color = markColor(p);
            var mk = markerSVG(color, p.truck, !!p.note, p.stuck);
            var pm = new ymaps.Placemark([p.lat, p.lon], {
              balloonContentHeader: 'Автовоз ' + p.truck + (p.prev ? ' <span style="font-weight:400;color:#90a4ae;font-size:12px">(ранее ' + p.prev + ')</span>' : ''),
              balloonContentBody: balloonBody(p),
              hintContent: '<b>' + p.truck + '</b>' + (p.prev ? ' (ранее ' + p.prev + ')' : '') + ' · ' + kmText(p.km) + ' до Москвы' +
                (p.stuck ? ' · стоит' : ''),
              clusterCaption: p.truck + ' · ' + kmText(p.km)
            }, {
              iconLayout: 'default#image',
              iconImageHref: mk.href,
              iconImageSize: mk.size,
              iconImageOffset: mk.offset,
              balloonMaxWidth: 290,
              hideIconOnBalloonOpen: false
            });
            marksByTruck[p.truck] = pm;
            return pm;
          });

          cluster.add(placemarks);

          if (placemarks.length) {
            map.setBounds(cluster.getBounds(), { checkZoomRange: true, zoomMargin: 80 });
          }

          var lostCount = records.filter(function (p) { return p.days >= 5; }).length;
          var stuckCount = records.filter(function (p) { return p.stuck; }).length;

          var sub = 'В пути: ' + records.length;
          if (stuckCount) sub += ' · стоят: ' + stuckCount;
          if (lostCount) sub += ' · без связи: ' + lostCount;
          document.getElementById('count').textContent = sub;

          document.getElementById('stamp').textContent =
            'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

          renderList(document.getElementById('search').value.trim().toLowerCase());
        })
        .catch(function () {
          document.getElementById('count').textContent = 'Ошибка загрузки';
          document.getElementById('stamp').textContent = 'Нет связи с базой';
        });
    }
  </script>
</body>
</html>
